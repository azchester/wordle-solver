<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Wordle Solver">
  <!-- Dark app chrome -->
  <rect width="32" height="32" rx="7" fill="#0f1419"/>
  <!-- Soft inner panel -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="5.5" fill="#1a2332"/>

  <!-- Wordle-style 2×2 tiles: green / yellow / gray / green -->
  <g>
    <!-- TL green + W -->
    <rect x="4" y="4" width="11.5" height="11.5" rx="2.2" fill="#538d4e"/>
    <text
      x="9.75"
      y="12.85"
      text-anchor="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
      font-size="9"
      font-weight="800"
      fill="#ffffff"
      letter-spacing="-0.04em"
    >W</text>

    <!-- TR yellow -->
    <rect x="16.5" y="4" width="11.5" height="11.5" rx="2.2" fill="#b59f3b"/>
    <text
      x="22.25"
      y="12.85"
      text-anchor="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
      font-size="9"
      font-weight="800"
      fill="#111111"
      letter-spacing="-0.04em"
    >S</text>

    <!-- BL gray -->
    <rect x="4" y="16.5" width="11.5" height="11.5" rx="2.2" fill="#3a3a3c"/>

    <!-- BR green -->
    <rect x="16.5" y="16.5" width="11.5" height="11.5" rx="2.2" fill="#538d4e"/>
  </g>

  <!-- Accent “solver” spark (matches app --accent) -->
  <circle cx="26.2" cy="26.2" r="2.15" fill="#4a9eff"/>
  <circle cx="26.2" cy="26.2" r="0.85" fill="#e7ecf3"/>
</svg>
